<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LSSD Recruitment Application</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- THUMBNAIL / DISCORD -->
<meta property="og:title" content="LSSD Recruitment Application">
<meta property="og:description" content="Apply to the Los Santos County Sheriff's Department.">
<meta property="og:image" content="https://lobo-gen.github.io/lssd.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lobo-gen.github.io/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2E3E2B">

<style>
body {
  font-family: Arial;
  max-width: 1100px;
  margin: auto;
  background-color: #2E3E2B;
  color: #fff;
}

/* HEADER */
.header {
  display:flex;
  align-items:center;
  gap:15px;
  margin:20px 0 30px 0;
  padding-bottom:10px;
  border-bottom:2px solid #556B2F;
  box-shadow:0 4px 6px rgba(0,0,0,0.3);
}

.header img { width:65px; }

/* GRID */
.section-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* CARDS */
.card {
  background:#fff;
  color:#111;
  padding:12px;
  border-radius:6px;
  box-shadow:0 4px 6px rgba(0,0,0,0.25);
}

.full { grid-column: span 3; }

textarea, input {
  width:100%;
  margin-bottom:6px;
}

/* CHECKBOX LEFT ALIGN FIX */
.option {
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:flex-start;
}

.option input {
  margin:0;
}

/* VALIDATION */
.input-error {
  border:2px solid #c0392b !important;
}

.input-ok {
  border:2px solid #2ecc71 !important;
}

.output-area {
  margin-top:40px;
}
</style>
</head>

<body>

<div class="header">
  <img src="sheriff.png">
  <h2>LSSD Recruitment Application</h2>
</div>

<!-- PERSONAL -->
<h3>1. PERSONAL INFORMATION</h3>

<div class="section-grid">

<div class="card">
<input id="firstName" placeholder="First Name">
<input id="middleName" placeholder="Middle Name">
<input id="lastName" placeholder="Last Name">
</div>

<div class="card">
<input id="dob" type="date">
<input id="birthPlace" placeholder="Place of Birth">
</div>

<div class="card">
<label class="option"><input type="radio" name="gender" value="Male"> Male</label>
<label class="option"><input type="radio" name="gender" value="Female"> Female</label>
<label class="option"><input type="radio" name="gender" value="Other"> Other</label>
</div>

<div class="card">
<label class="option"><input type="radio" name="race" value="White"> White</label>
<label class="option"><input type="radio" name="race" value="Black"> Black</label>
<label class="option"><input type="radio" name="race" value="Hispanic"> Hispanic</label>
<label class="option"><input type="radio" name="race" value="Asian"> Asian</label>
</div>

<div class="card">
<input id="feet" placeholder="Feet">
<input id="inches" placeholder="Inches">
<input id="pounds" placeholder="Pounds">
</div>

<div class="card">
<label class="option"><input type="radio" name="marital" value="Single"> Single</label>
<label class="option"><input type="radio" name="marital" value="Married"> Married</label>
<label class="option"><input type="radio" name="marital" value="Divorced"> Divorced</label>
</div>

<div class="card full">
<input id="address" placeholder="Street">
<input id="city" placeholder="City">
<input id="state" placeholder="State">
<input id="phone" placeholder="Phone">
</div>

</div>

<!-- BACKGROUND -->
<h3>2. BACKGROUND</h3>

<div class="section-grid">

<div class="card">
<h4>12. LEVEL OF EDUCATION</h4>
<label class="option"><input type="radio" name="education" value="High School"> High School</label>
<label class="option"><input type="radio" name="education" value="College"> College</label>
<label class="option"><input type="radio" name="education" value="Degree"> Degree</label>
</div>

<div class="card">
<h4>13. DO YOU POSSESS A VALID SAN ANDREAS DRIVER LICENSE?</h4>
<label class="option"><input type="radio" name="license" value="Yes"> Yes</label>
<label class="option"><input type="radio" name="license" value="No"> No</label>
</div>

<div class="card">
<h4>14. WORK ELIGIBILITY</h4>
<label class="option"><input type="radio" name="work" value="Yes"> Yes</label>
<label class="option"><input type="radio" name="work" value="No"> No</label>
</div>

<div class="card full">
<input id="languages" placeholder="Languages">
</div>

</div>

<!-- OOC -->
<h3>4. OUT OF CHARACTER</h3>

<div class="section-grid">

<div class="card">
<input id="timezone" placeholder="Timezone & Country">
<input id="discord" placeholder="Discord">
</div>

<div class="card">
<h4>19. UCP AND CHARACTERS</h4>
<input id="ucpName" placeholder="UCP Name">
<div id="charList"></div>
<button onclick="addChar()">+ Add</button>
</div>

<div class="card">
<input id="adminRecord" placeholder="Admin Record Link">
</div>

<div class="card full">
<textarea id="story" rows="10" placeholder="Background Story (AI = disqualification)"></textarea>
</div>

</div>

<div class="output-area">
<h3>Output</h3>
<textarea id="output" rows="18"></textarea>
</div>

<script>
const $ = id => document.getElementById(id);

// LOCAL STORAGE
document.querySelectorAll("input, textarea").forEach(el=>{
  if(!el.id) return;
  const saved = localStorage.getItem(el.id);
  if(saved) el.value = saved;
  el.addEventListener("input", ()=>localStorage.setItem(el.id, el.value));
});

// VALIDATION
const required = ["firstName","lastName","dob","ucpName","discord","story"];

function validate(el){
  if(!el.value.trim()){
    el.classList.add("input-error");
    el.classList.remove("input-ok");
  } else {
    el.classList.remove("input-error");
    el.classList.add("input-ok");
  }
}

required.forEach(id=>{
  const el=$(id);
  if(!el) return;
  el.addEventListener("input",()=>validate(el));
});

// HELPERS
function getRadio(name){
  const r=document.querySelector(`input[name="${name}"]:checked`);
  return r ? r.value : "D.N.A.";
}

function addChar(){
  const i=document.createElement("input");
  i.placeholder="Character name";
  document.getElementById("charList").appendChild(i);
}

// UPDATE
document.querySelectorAll("input, textarea").forEach(el=>{
  el.addEventListener("input",update);
});
document.querySelectorAll("input[type=radio]").forEach(el=>{
  el.addEventListener("change",update);
});

function update(){

required.forEach(id=>validate($(id)));

let chars="";
document.querySelectorAll("#charList input").forEach((i,idx)=>{
  chars += `[*] Character ${idx+1}: ${i.value || "D.N.A."}\n`;
});

const out = `
[b]1. FIRST NAME[/b]
${$("firstName").value || "D.N.A."}

[b]3. LAST NAME[/b]
${$("lastName").value || "D.N.A."}

[b]13. DRIVER LICENSE[/b]
${getRadio("license")}

[b]19. UCP NAME[/b]
${$("ucpName").value || "D.N.A."}

${chars}

[b]21. STORY[/b]
${$("story").value || "D.N.A."}
`;

$("output").value = out.trim();
}
</script>

</body>
</html>
